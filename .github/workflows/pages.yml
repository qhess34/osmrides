name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Page de présentation du moteur ; jeu.html = redirection de l'ancienne adresse du jeu vers osmrides_parks ;
      # sw.js = retrait de l'ancien mode hors ligne. Le moteur lui-même est servi par version (docs/versions.md).
      - name: Assembler le site (présentation du moteur)
        run: |
          mkdir _site
          cp index.html jeu.html sw.js _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
