# Éditeur T2Z en local (editor/README.md, docs/ARCHITECTURE.md D5).
#   export T2Z_UID=$(id -u) T2Z_GID=$(id -g)   # propriétaire des fichiers écrits (défaut 1000:1000)
#   docker compose up -d                        # puis http://127.0.0.1:8787/
#   docker compose down
# Dépôt monté en lecture seule, sauf sites/ (seul dossier où l'éditeur écrit : sites/<site>.game.js). Port lié à 127.0.0.1 : invisible depuis le réseau.
services:
  editeur:
    image: node:22-alpine
    user: "${T2Z_UID:-1000}:${T2Z_GID:-1000}"
    working_dir: /depot
    command: ["node", "editor/server.js"]
    environment:
      HOST: 0.0.0.0        # dans le conteneur ; sur l'hôte, le port n'est publié que sur 127.0.0.1
      PORT: "8787"
      T2Z_ROOT: /depot
    volumes:
      - type: bind
        source: .
        target: /depot
        read_only: true
      - type: bind
        source: ./sites
        target: /depot/sites
    ports:
      - "127.0.0.1:8787:8787"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
